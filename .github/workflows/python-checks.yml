name: Python checks

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile check (schema + solver + scripts + tests)
        run: |
          python -m py_compile schema/powersim_schema.py \
              solver/powersim_solver.py \
              solver/powersim_dataio.py \
              solver/powersim_asset_mapper.py \
              solver/powersim_kpi.py \
              solver/powersim_stochastic.py \
              solver/powersim_expansion.py \
              solver/bess_sizing.py \
              scripts/build_demo_project.py \
              scripts/run_horizon.py \
              scripts/run_mc_sweep.py \
              scripts/powersim_report.py \
              scripts/db_ingest.py \
              scripts/batch.py \
              tests/smoke_168h.py \
              tests/test_maintenance.py \
              tests/test_bess_plexos_parity.py \
              tests/test_bess_sizing.py \
              tests/test_hydro_inflow_units.py \
              tests/test_hydro_stage2.py \
              tests/test_thermal_stage3.py \
              tests/test_solar_stage4.py \
              tests/test_wind_stage5.py \
              tests/test_cost_database.py \
              tests/test_load_dataio.py \
              solver/cost_database.py \
              solver/load_dataio.py \
              scripts/cost_lookup.py \
              scripts/refresh_cost_database.py \
              scripts/load_gse_projections.py \
              tests/test_adequacy_expansion.py \
              tests/test_adequacy_metrics.py \
              tests/test_objective_closure.py \
              tests/test_reserve_storage_provision.py \
              tests/test_rolling_boundary_ramp.py \
              tests/test_stochastic_summary.py \
              tests/test_gse_2026_registry_mapping.py \
              tests/check_json_contract.py \
              tests/check_demo_asset_registry.py \
              tests/test_rolling_carryover.py \
              tests/test_subhourly_ramp.py
      - name: Dependency sanity
        run: |
          python - <<'PY'
          import importlib.util
          mods = ['pyomo','highspy','pandas','numpy','openpyxl','xlsxwriter']
          missing = [m for m in mods if importlib.util.find_spec(m) is None]
          if missing:
              raise SystemExit(f"Missing runtime modules: {missing}")
          print('All core runtime modules importable.')
          PY
      - name: Schema self-test
        run: python schema/powersim_schema.py
      - name: Maintenance enforcement test (deterministic)
        run: python tests/test_maintenance.py
      - name: BESS PLEXOS-parity test (deterministic)
        # Proves new optional BESS fields (self-discharge, asymmetric power,
        # c-rate, aux load, ramp, end-SOC target) and aging output metrics.
        run: python tests/test_bess_plexos_parity.py
      - name: Hydro Stage 1 test (deterministic)
        # Proves m³/s → Mm³/h inflow conversion, spill_cost penalty, and
        # cascade_flow_mode='release_plus_spill' downstream delivery.
        run: python tests/test_hydro_inflow_units.py
      - name: Hydro Stage 2 test (deterministic)
        # Proves min_release_mm3h, monthly storage_targets soft penalty,
        # and head-dependent (window-level) efficiency curve.
        run: python tests/test_hydro_stage2.py
      - name: Thermal Stage 3 test (deterministic)
        # Proves CO₂ factor + price, multi-stage startup (hot/cold), and
        # ambient temperature capacity derating.
        run: python tests/test_thermal_stage3.py
      - name: Solar / VRE Stage 4 test (deterministic)
        # Proves DC/AC ratio inverter clipping, inverter efficiency,
        # multi-year degradation factor, and temperature derating on solar.
        run: python tests/test_solar_stage4.py
      - name: Wind Stage 5 test (deterministic)
        # Proves wake_loss_frac, monthly_availability_factor mask, and
        # air_density_correction (∝ 1/T_kelvin) — wind-only multipliers.
        run: python tests/test_wind_stage5.py
      - name: PyPSA-Eur cost database test (deterministic)
        # Verifies the committed cost snapshot loads, covers core
        # technologies (CCGT/OCGT/onwind/solar/battery), the annuity
        # math matches the closed-form CRF, and missing-key paths raise.
        run: python tests/test_cost_database.py
      - name: GSE hourly-load loader test (deterministic)
        # Verifies the 2026-2030 P50 load snapshot: 5 years × 8760 h,
        # annual GWh matches the target labels within 0.1%, peak grows
        # monotonically, and profiles pass the schema validator.
        run: python tests/test_load_dataio.py
      - name: JSON contract regression checks
        run: python tests/check_json_contract.py
      - name: Demo asset registry validator
        # Validates samples/demo_asset_registry_2026.json against schema.
        run: python tests/check_demo_asset_registry.py
      - name: Rolling-horizon carry-over deterministic tests
        # Proves cross-window invariants (gas annual / monthly, DR
        # annual hours, UC min_up / min_down boundary state, BESS SOC,
        # and reservoir-hydro storage) — see tests/test_rolling_carryover.py.
        run: python tests/test_rolling_carryover.py
      - name: Sub-hourly ramp-rate deterministic tests
        # Proves ramp_up and ramp_down both scale MW/h limits by period dt.
        run: python tests/test_subhourly_ramp.py
      - name: Rolling boundary ramp deterministic tests
        # Proves ramp limits are enforced across rolling-window boundaries.
        run: python tests/test_rolling_boundary_ramp.py
      - name: Reserve storage provision deterministic tests
        # Proves BESS and pumped-hydro can provide spinning / non-spinning reserve.
        run: python tests/test_reserve_storage_provision.py
      - name: Objective closure deterministic tests
        # Proves the reconstructed objective matches the solver's reported value.
        run: python tests/test_objective_closure.py
      - name: Stochastic summary deterministic tests
        # Proves stochastic scenario weights and summary aggregation are correct.
        run: python tests/test_stochastic_summary.py
      - name: Adequacy metrics deterministic tests
        # Proves LOLE / EENS / reserve-margin calculation against synthetic input.
        run: python tests/test_adequacy_metrics.py
      - name: Adequacy + expansion deterministic tests
        # Proves the Stage 1 adequacy screening and expansion candidate workflow.
        run: python tests/test_adequacy_expansion.py
      - name: Pytest-style suites (BESS sizing + GSE 2026 registry mapping)
        # tests/test_bess_sizing.py and tests/test_gse_2026_registry_mapping.py are
        # pytest-style; running them directly via python silently no-ops.
        run: python -m pytest tests/test_bess_sizing.py tests/test_gse_2026_registry_mapping.py
      - name: Smoke test (synthetic project_data → solver → validate)
        run: |
          python scripts/build_demo_project.py --out project_data
          python tests/smoke_168h.py \
              --project-dir project_data \
              --config      tests/stage1_smoke_fleet.json \
              --keep-outputs out/ci_smoke_168h
