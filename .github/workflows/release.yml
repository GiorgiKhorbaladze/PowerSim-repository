name: Publish PowerSim release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: powersim-python-distributions
          path: dist/*

  windows-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          choco install innosetup --no-progress -y
      - name: Build final portable application and installer
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1
          Compress-Archive -Path "dist/PowerSim/*" -DestinationPath "dist/PowerSim-1.0.0-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: powersim-windows-release
          path: |
            dist/PowerSim-1.0.0-Windows-x64.zip
            dist/installer/PowerSim-1.0.0-Windows-x64-Setup.exe

  github-release:
    runs-on: ubuntu-latest
    needs: [python-distributions, windows-artifacts]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish tagged assets
        uses: softprops/action-gh-release@v2
        with:
          name: PowerSim 1.0
          body: "PowerSim 1.0 release. See docs/POWERSIM_1_0_RELEASE_NOTES.md in this tagged source."
          files: |
            release-assets/powersim-python-distributions/*
            release-assets/powersim-windows-release/PowerSim-1.0.0-Windows-x64.zip
            release-assets/powersim-windows-release/PowerSim-1.0.0-Windows-x64-Setup.exe
