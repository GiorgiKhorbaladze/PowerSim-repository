name: 2027-2030 study input audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/res-bess-2027-2030-final]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install pandas openpyxl
      - name: Audit repository study inputs
        run: python scripts/audit_study_inputs_2027_2030.py
      - name: Extract exact study data
        run: python scripts/extract_study_data_2027_2030.py
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-input-audit
          path: out/study_audit/study_input_audit.json
      - name: Upload extracted study data
        uses: actions/upload-artifact@v4
        with:
          name: study-data-2027-2030
          path: out/study_extract/study_data_2027_2030.json
      - name: Upload reproducible study input files
        uses: actions/upload-artifact@v4
        with:
          name: study-raw-inputs
          compression-level: 6
          path: |
            Info.xlsx
            data/gse_load_2026_2030.json
            data/renewables/
            PLEXOS_2026_profiles-or.zip
            PLEXOS_2026_zones_60files.zip
            plexos model.zip
