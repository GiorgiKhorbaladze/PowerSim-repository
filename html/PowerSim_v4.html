    stroke:{width:2}, colors:['#e03144'],
    fill:{type:'gradient', gradient:{shadeIntensity:0.6}},
  });
  // Reserve margin time series
  mkChart('c-rel-rm', {
    chart:{type:'line', height:240, toolbar:{show:false}, animations:{enabled:false}},
    series:[{name:'Reserve margin %', data: rm}],
    xaxis:{categories: hs.map(h=>h.t), labels:{show:false}, title:{text:'საათი'}},
    yaxis:{labels:{formatter:v=>v.toFixed(0)+'%'}, title:{text:'%'}},
    stroke:{width:2}, colors:['#20d68a'],
    annotations:{ yaxis:[{y:15, borderColor:'#f0c040', label:{text:'15% target', style:{fontSize:'8px'}}}] },
  });
  document.getElementById('rep-rel-note').textContent =
    `Notes: LOLE / EUE annualised by extrapolation from horizon (${(H*dt_h).toFixed(0)}h); for accurate LOLE, run 8760h MC sweep.`;
}

// ── 23. Cross-Border Balance (Phase 7b #4) ──────────────────────────
function _repXBorder(ctx){
  const { hbu, bu, hs, dt_h } = ctx;
  const imps = Object.keys(bu).filter(g => bu[g].type === 'import');
  if(!imps.length){
    document.getElementById('c-xborder-hourly').innerHTML='<div style="color:var(--t3);font-size:8px;padding:8px">No import assets</div>';
    document.getElementById('c-xborder-monthly').innerHTML='';
    document.getElementById('rep-xborder-tbl').innerHTML='';
    document.getElementById('rep-xborder-kpis').innerHTML='';
    return;
  }
  // Hourly schedule chart (top 5 imports)
  mkChart('c-xborder-hourly', {
    chart:{type:'area', height:240, toolbar:{show:false}, stacked:true, animations:{enabled:false}},
    series: imps.slice(0,5).map(g => ({
      name: bu[g].name || g,
      data: (hbu[g]||[]).slice(0, Math.min(720, hs.length)).map(r => +(r.dispatch_mw||0).toFixed(1))
    })),
    xaxis:{categories: hs.slice(0, Math.min(720, hs.length)).map(h=>h.t), labels:{show:false}},
    yaxis:{labels:{formatter:v=>v.toFixed(0)}, title:{text:'MW'}},
    stroke:{width:0}, fill:{opacity:0.85},
    legend:{position:'top', fontSize:'8px'},
    colors:['#a463f8','#3d8ef0','#f07830','#20d68a','#f0c040'],
  });
  // Monthly net by border
  const monthly = ctx.monthly || [];
  if(monthly.length){
    mkChart('c-xborder-monthly', {
      chart:{type:'bar', height:240, toolbar:{show:false}, stacked:false},
      series: imps.map(g => ({
        name: bu[g].name || g,
        data: monthly.map(m => +((m.by_unit||{})[g]?.energy_mwh || 0).toFixed(0))
      })),
      xaxis:{categories: monthly.map(m=>m.label||('M'+m.month))},
      yaxis:{labels:{formatter:v=>v>=1e3?(v/1e3).toFixed(1)+'k':v.toFixed(0)}, title:{text:'MWh'}},
      colors:['#a463f8','#3d8ef0','#f07830','#20d68a','#f0c040'],
      legend:{position:'top', fontSize:'8px'},
    });
  }
  // KPI cards per border
  const kpis = imps.map(g => {
    const a = bu[g];
    const e = +a.energy_mwh || 0;
    const cost = +a.gross_cost || 0;
    const cap = +a.energy_mwh / Math.max((+a.capacity_factor||0.01)/100 * 8760, 1);
    return {g, name:a.name||g, energy:e, cost, cap, util:(+a.capacity_factor||0)};
  });
  document.getElementById('rep-xborder-kpis').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="kpi-label">${k.name}</div>
       <div class="kpi-val">${(k.energy/1000).toFixed(1)}k <span class="kpi-unit">MWh</span></div>
       <div style="font-size:7.5px;color:var(--t3)">$/${k.energy>0?(k.cost/k.energy).toFixed(0):'—'}/MWh · util ${k.util.toFixed(1)}%</div>
     </div>`).join('');
  // Detail table
  document.getElementById('rep-xborder-tbl').innerHTML =
    `<table><thead><tr><th>Border</th><th class="mono">Energy MWh</th><th class="mono">Cost $</th>
       <th class="mono">Avg $/MWh</th><th class="mono">Cap MW</th><th class="mono">Util %</th></tr></thead>
     <tbody>${kpis.map(k=>`<tr><td>${k.name}</td>
       <td class="mono">${(k.energy).toLocaleString('en-US',{maximumFractionDigits:0})}</td>
       <td class="mono">$${(k.cost).toLocaleString('en-US',{maximumFractionDigits:0})}</td>
       <td class="mono">$${k.energy>0?(k.cost/k.energy).toFixed(2):'—'}</td>
       <td class="mono">${k.cap.toFixed(0)}</td>
       <td class="mono">${k.util.toFixed(1)}</td></tr>`).join('')}</tbody></table>`;
}

// ── 24. Hydro Water-Energy Efficiency (Phase 7b #7) ─────────────────
function _repWaterEnergy(ctx){
  const { hbu, bu, hs, dt_h } = ctx;
  const hReg = Object.keys(bu).filter(g => bu[g].type === 'hydro_reg');
  if(!hReg.length){
    document.getElementById('rep-water-tbl').innerHTML='<div style="font-size:8px;color:var(--t3);padding:8px">No reservoir hydro</div>';
    document.getElementById('c-water-eff').innerHTML='';
    document.getElementById('c-water-balance').innerHTML='';
    return;
  }
  const NOMINAL_EFF = 350;   // assumed efficiency MWh/Mm³ for comparison
  const rows = hReg.map(g => {
    const rs = hbu[g] || [];
    let energy = 0, release = 0, inflow = 0, spill = 0;
    rs.forEach(r => {
      energy  += (+r.dispatch_mw || 0) * dt_h;
      const h = r.hydro || {};
      release += (+h.release_mm3h || 0) * dt_h;
      inflow  += (+h.inflow_mm3h  || 0) * dt_h;
      spill   += (+h.spill_mm3h   || 0) * dt_h;
    });
    const realized_eff = release > 0 ? energy / release : 0;
    return {g, name: bu[g].name||g, energy, release, inflow, spill, realized_eff};
  }).sort((a,b)=>b.energy-a.energy);
  document.getElementById('rep-water-tbl').innerHTML =
    `<table><thead><tr><th>HPP</th><th class="mono">Energy MWh</th><th class="mono">Release Mm³</th>
       <th class="mono">Inflow Mm³</th><th class="mono">Spill Mm³</th><th class="mono">MWh/Mm³</th><th>vs nominal</th></tr></thead>
     <tbody>${rows.map(r=>{
        const ratio = r.realized_eff / NOMINAL_EFF;
        const cls = ratio>0.95?'var(--green)':ratio>0.8?'var(--gold)':'var(--red)';
        return `<tr><td>${r.name}</td>
          <td class="mono">${r.energy.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
          <td class="mono">${r.release.toFixed(2)}</td>
          <td class="mono">${r.inflow.toFixed(2)}</td>
          <td class="mono" style="color:${r.spill>0.5?'var(--red)':'var(--t3)'}">${r.spill.toFixed(3)}</td>
          <td class="mono">${r.realized_eff.toFixed(0)}</td>
          <td class="mono" style="color:${cls}">${(ratio*100).toFixed(0)}%</td></tr>`;}).join('')}
     </tbody></table>`;
  // Realized efficiency bar chart
  mkChart('c-water-eff', {
    chart:{type:'bar', height:240, toolbar:{show:false}},
    series:[{name:'realized MWh/Mm³', data: rows.map(r=>+r.realized_eff.toFixed(0))}],
    xaxis:{categories: rows.map(r=>r.name)},
    yaxis:{labels:{formatter:v=>v.toFixed(0)}, title:{text:'MWh/Mm³'}},
    plotOptions:{bar:{distributed:true, columnWidth:'55%'}},
    colors: rows.map(r=>r.realized_eff>=NOMINAL_EFF*0.95?'#20d68a':r.realized_eff>=NOMINAL_EFF*0.8?'#f0c040':'#e03144'),
    legend:{show:false},
    annotations:{ yaxis:[{y:NOMINAL_EFF, borderColor:'#a8c4e0', label:{text:'nominal '+NOMINAL_EFF, style:{fontSize:'7.5px'}}}] },
  });
  // Stacked balance bars
  mkChart('c-water-balance', {
    chart:{type:'bar', height:240, toolbar:{show:false}, stacked:true},
    series:[
      {name:'Inflow',  data: rows.map(r=>+r.inflow.toFixed(2))},
      {name:'Release', data: rows.map(r=>-(+r.release.toFixed(2)))},
      {name:'Spill',   data: rows.map(r=>-(+r.spill.toFixed(2)))},
    ],
    xaxis:{categories: rows.map(r=>r.name)},
    yaxis:{labels:{formatter:v=>v.toFixed(1)}, title:{text:'Mm³'}},
    colors:['#00B0F0','#3d8ef0','#e03144'],
    legend:{position:'top', fontSize:'8px'},
  });
}

// ── 25. Marginal-Unit Timeline + Sankey (Phase 7c #9) ───────────────
function _repMarginalSankey(ctx){
  const { hs, hbu, bu } = ctx;
  // Per hour: marginal asset is the dispatched committed asset with highest SRMC.
  const mc_of = g => +(bu[g] || {}).SRMC || 0;
  const marginal_per_t = hs.map((_, t) => {
    let best = null, bestMC = -1;
    for(const g of Object.keys(hbu)){
      const r = hbu[g][t]; if(!r) continue;
      if((+r.dispatch_mw||0) > 0.5){
        const m = mc_of(g);
        if(m > bestMC){ bestMC = m; best = g; }
      }
    }
    return best || '—';
  });
  const counts = {};
  marginal_per_t.forEach(g => { counts[g] = (counts[g]||0) + 1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  // Pie of % hours marginal
  mkChart('c-marg-pie', {
    chart:{type:'pie', height:280},
    series: sorted.slice(0,8).map(x=>x[1]),
    labels: sorted.slice(0,8).map(([g])=>(bu[g]||{name:g}).name||g),
    legend:{position:'bottom', fontSize:'8px'},
  });
  // Timeline of marginal asset for top 6 most-marginal assets
  const top6 = sorted.slice(0,6).map(x=>x[0]);
  const series = top6.map(g => ({
    name: (bu[g]||{name:g}).name||g,
    data: marginal_per_t.map(m => m===g ? 1 : 0)
  }));
  mkChart('c-marg-timeline', {
    chart:{type:'area', height:280, stacked:true, toolbar:{show:false}, animations:{enabled:false}},
    series, xaxis:{categories: hs.map(h=>h.t), labels:{show:false}},
    yaxis:{labels:{show:false}, max:1, min:0},
    stroke:{width:0}, fill:{opacity:0.85},
    legend:{position:'top', fontSize:'8px'},
    tooltip:{y:{formatter:v=>v?'marginal':'—'}},
  });
  // Energy-flow Sankey (rendered as simple HTML/SVG since ApexCharts doesn't have native Sankey)
  const stack = ctx.stack;
  const cats = ctx.cats.filter(c => stack[c].some(v => Math.abs(v)>0.01));
  const totalMWh = (arr) => arr.reduce((s,v)=>s+v,0) * ctx.dt_h;
  const tech_total = {}; cats.forEach(c => tech_total[c] = totalMWh(stack[c]));
  const sysTotal = Object.values(tech_total).reduce((s,v)=>s+v,0);
  const FUEL = {ccgt:'gas', ocgt:'gas', coal:'coal', hydro_reg:'water', hydro_ror:'water',
                wind:'wind', solar:'solar', import:'imports', bess:'storage', dr:'demand-response',
                pumped_hydro:'pumped storage'};
  const fuels = {};
  cats.forEach(c => { const f = FUEL[c]||c; fuels[f] = (fuels[f]||0) + tech_total[c]; });
  // Render as 3-column flow: fuel → tech → load
  const W = 600, H = 360, padX = 100;
  const maxFlow = Math.max(...Object.values(tech_total).filter(v=>v>0), 1);
  const yStep = H / Math.max(cats.length, 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:380px">
    <text x="${padX/2}" y="14" font-size="9" fill="#a8c4e0" text-anchor="middle">Fuel</text>
    <text x="${W/2}"   y="14" font-size="9" fill="#a8c4e0" text-anchor="middle">Technology</text>
    <text x="${W-padX/2}" y="14" font-size="9" fill="#a8c4e0" text-anchor="middle">Demand</text>`;
  // Fuel boxes (left)
  let yF = 30;
  const fuelY = {};
  Object.entries(fuels).forEach(([f, v]) => {
    const h = Math.max(8, (v/sysTotal)*H*0.85);
    fuelY[f] = yF + h/2;
    svg += `<rect x="${padX/2-30}" y="${yF}" width="60" height="${h}" fill="#0e2040" stroke="#1a3a5c"/>`;
    svg += `<text x="${padX/2}" y="${yF+h/2+3}" font-size="8" fill="#e8f0fa" text-anchor="middle">${f}</text>`;
    yF += h + 4;
  });
  // Tech boxes (middle)
  let yT = 30;
  const techY = {};
  cats.forEach(c => {
    const v = tech_total[c]; if(v<=0) return;
    const h = Math.max(8, (v/sysTotal)*H*0.85);
    techY[c] = yT + h/2;
    const col = FUEL_PALETTE[c] || '#888';
    svg += `<rect x="${W/2-40}" y="${yT}" width="80" height="${h}" fill="${col}" opacity="0.85"/>`;
    svg += `<text x="${W/2}" y="${yT+h/2+3}" font-size="8" fill="#fff" text-anchor="middle">${c} ${(v/1000).toFixed(0)}k</text>`;
    yT += h + 4;
  });
  // Demand box (right)
  svg += `<rect x="${W-padX/2-30}" y="40" width="60" height="${H-80}" fill="#0d1f38" stroke="#1a3a5c"/>`;
  svg += `<text x="${W-padX/2}" y="${H/2+3}" font-size="8" fill="#e8f0fa" text-anchor="middle">load ${(sysTotal/1000).toFixed(0)}k MWh</text>`;
  // Flows fuel→tech
  cats.forEach(c => {
    const v = tech_total[c]; if(v<=0) return;
    const f = FUEL[c] || c;
    const yfuel = fuelY[f]||30, ytech = techY[c]||30;
    svg += `<path d="M ${padX/2+30} ${yfuel} C ${W*0.35} ${yfuel}, ${W*0.4} ${ytech}, ${W/2-40} ${ytech}"
        stroke="${FUEL_PALETTE[c]||'#888'}" stroke-width="${Math.max(1, (v/sysTotal)*H*0.4)}"
        fill="none" opacity="0.4"/>`;
  });
  // Flows tech→load
  cats.forEach(c => {
    const v = tech_total[c]; if(v<=0) return;
    const ytech = techY[c] || 30;
    svg += `<path d="M ${W/2+40} ${ytech} C ${W*0.65} ${ytech}, ${W*0.7} ${H/2}, ${W-padX/2-30} ${H/2}"
        stroke="${FUEL_PALETTE[c]||'#888'}" stroke-width="${Math.max(1, (v/sysTotal)*H*0.4)}"
        fill="none" opacity="0.4"/>`;
  });
  svg += '</svg>';
  document.getElementById('c-sankey').innerHTML = svg;
}

// ── 26. Maintenance Gantt (Phase 7c #10) ────────────────────────────
function _repMaintenance(ctx){
  const { bu, hbu, dt_h } = ctx;
  // Detect outage windows: consecutive periods with commitment=0 for thermal/hydro_reg
  const candidates = Object.keys(bu).filter(g => bu[g].type === 'thermal' || bu[g].type === 'hydro_reg');
  const outages = [];     // {asset, start_h, end_h, dur_h}
  candidates.forEach(g => {
    const rows = hbu[g] || [];
    let in_outage = false, start = 0;
    for(let t=0; t<rows.length; t++){
      const com = rows[t]?.commitment;
      if(com === 0){
        if(!in_outage){ in_outage = true; start = t; }
      } else {
        if(in_outage){
          if(t - start >= 6){     // ≥6 periods to count as scheduled outage
            outages.push({asset:g, start_h:start*dt_h, end_h:t*dt_h, dur_h:(t-start)*dt_h});
          }
          in_outage = false;
        }
      }
    }
    if(in_outage && rows.length - start >= 6){
      outages.push({asset:g, start_h:start*dt_h, end_h:rows.length*dt_h, dur_h:(rows.length-start)*dt_h});
    }
  });
  outages.sort((a,b)=>a.start_h-b.start_h);
  document.getElementById('rep-maint-tbl').innerHTML =
    !outages.length
      ? `<div style="font-size:8px;color:var(--t3);padding:8px">No detected outages (≥6h commitment=0). For declared maintenance windows, set asset.maint_windows in input.</div>`
      : `<table><thead><tr><th>Asset</th><th>Start h</th><th>End h</th><th>Duration h</th></tr></thead>
         <tbody>${outages.slice(0,15).map(o=>`<tr><td>${(bu[o.asset]||{}).name||o.asset}</td>
           <td class="mono">${o.start_h.toFixed(0)}</td><td class="mono">${o.end_h.toFixed(0)}</td>
           <td class="mono">${o.dur_h.toFixed(0)}</td></tr>`).join('')}
         ${outages.length>15?`<tr><td colspan="4" style="color:var(--t3)">… +${outages.length-15} more</td></tr>`:''}</tbody></table>`;
  // Gantt — rows = assets, x = hours
  if(outages.length){
    const totalH = Math.max(...outages.map(o=>o.end_h), 24);
    const assetsList = [...new Set(outages.map(o=>o.asset))];
    const W = 800, rowH = 14, H = Math.max(140, assetsList.length * rowH + 40);
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-height:${H}px">`;
    // X axis ticks
    const ticks = 8;
    for(let i=0; i<=ticks; i++){
      const x = 120 + (i/ticks)*(W-140);
      svg += `<line x1="${x}" y1="20" x2="${x}" y2="${H-10}" stroke="#1a3a5c" stroke-dasharray="2 2"/>`;
      svg += `<text x="${x}" y="14" font-size="7.5" fill="#a8c4e0" text-anchor="middle">${(i/ticks*totalH).toFixed(0)}h</text>`;
    }
    assetsList.forEach((g, i) => {
      const y = 30 + i*rowH;
      svg += `<text x="115" y="${y+9}" font-size="7.5" fill="#e8f0fa" text-anchor="end">${((bu[g]||{}).name||g).slice(0,20)}</text>`;
      outages.filter(o=>o.asset===g).forEach(o=>{
        const x1 = 120 + (o.start_h/totalH)*(W-140);
        const w  = Math.max(1, (o.dur_h/totalH)*(W-140));
        svg += `<rect x="${x1}" y="${y+1}" width="${w}" height="${rowH-3}" fill="#f07830" opacity="0.85"/>`;
      });
    });
    svg += '</svg>';
    document.getElementById('c-maint-gantt').innerHTML = svg;
  } else {
    document.getElementById('c-maint-gantt').innerHTML = '';
  }
  document.getElementById('rep-maint-note').textContent =
    `Detected ${outages.length} outage windows (≥6 periods of commitment=0). For maintenance scheduling, edit asset.maint_windows in input JSON.`;
}

};

// ── Excel export — rich pivot tables ─────────────────────────────────
function exportReportsXls(){
  if(!STATE.results){showBanner('შედეგები არ ჩაიტვ.','r');return;}
  const R = STATE.results;
  const ctx = _repBuildContext(R);
  const wb = XLSX.utils.book_new();
  const sm = R.system_summary || {};
  const meta = R.metadata || {};
  // 1. Summary
  const summRows = [
    ['Metric','Value','Unit'],
    ['Scenario',          meta.scenario || '—', ''],
    ['Schema version',    meta.schema_version || '—', ''],
    ['Horizon hours',     meta.horizon_hours || '—', 'h'],
    ['Resolution',        meta.resolution_min || 60, 'min'],
    ['Total cost',        sm.total_cost_usd, '$'],
    ['Total energy',      sm.total_energy_mwh, 'MWh'],
    ['Avg lambda',        sm.avg_lambda_usd_mwh, '$/MWh'],
    ['Peak load',         sm.peak_load_mw, 'MW'],
    ['Total gas',         sm.total_gas_mm3, 'Mm³'],
    ['Total unserved',    sm.total_unserved_mwh, 'MWh'],
    ['Total curtailed',   sm.total_curtailed_mwh, 'MWh'],
    ['Closure ok',        meta.closure_ok ? 'YES' : 'GAP', ''],
    ['Closure gap',       meta.closure_gap, ''],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summRows), 'Summary');
  // 2. Hourly system
  if(R.hourly_system) XLSX.utils.book_append_sheet(wb,
    XLSX.utils.json_to_sheet(R.hourly_system), 'Hourly_System');
  // 3. By unit summary
  if(R.by_unit_summary){
    const rows = Object.entries(R.by_unit_summary).map(([id, v]) => ({id, ...v}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'By_Unit_Summary');
  }
  // 4. Monthly
  if(R.monthly_summary){
    const flat = R.monthly_summary.map(m => ({
      month:m.month, label:m.label, hours:m.hours,
      total_energy_mwh: m.total_energy_mwh, total_cost_usd: m.total_cost_usd,
      avg_lambda: m.avg_lambda, gas_mm3: m.gas_mm3,
      curtailed_mwh: m.curtailed_mwh, unserved_mwh: m.unserved_mwh,
      peak_load_mw: m.peak_load_mw,
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flat), 'Monthly_System');
  }
  // 5. Pivot: monthly × asset energy
  if(R.monthly_summary){
    const allAssets = new Set();
    R.monthly_summary.forEach(m => Object.keys(m.by_unit||{}).forEach(g=>allAssets.add(g)));
    const cols = ['month','label', ...allAssets];
    const rows = R.monthly_summary.map(m => {
      const row = {month:m.month, label:m.label};
      for(const g of allAssets) row[g] = +((m.by_unit||{})[g] || {}).energy_mwh || 0;
      return row;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows, {header:cols}), 'Pivot_Monthly_Energy');
  }
  // 6. Stack/mix series
  if(ctx.stack){
    const cats = ctx.cats;
    const rows = ctx.hs.map((h,t) => {
      const row = {t, hour_of_year:h.hour_of_year, load_mw:h.load_mw};
      for(const c of cats) row[c] = +ctx.stack[c][t].toFixed(2);
      return row;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Tech_Mix_Hourly');
  }
  // 7. Diagnostics + IIS
  const diag = R.diagnostics || {};

// N-way compare store.  Back-compat: scenarioA/scenarioB remain as
// aliases to slots 0 and 1 for code paths that still read them.
STATE.compareSlots = [];

function addScenarios(input){
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  let loaded = 0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        const v=psValidateOutput(data);
        if(!v.ok) throw new Error(v.errors.slice(0,2).join('; '));
        const sid=(data.metadata&&data.metadata.scenario)||'?';
        const horizon=data.metadata?.horizon_hours||'?';
        STATE.compareSlots.push({name:file.name, scenario:sid, horizon:horizon, data:data});
        if(STATE.compareSlots.length===1) STATE.scenarioA=data;
        if(STATE.compareSlots.length===2) STATE.scenarioB=data;
        renderCompareList();
        loaded++;
        if(loaded===files.length){
          showBanner(`✅ ${loaded} scenario loaded (total: ${STATE.compareSlots.length})`,'g');
        }
      }catch(err){showBanner('❌ '+file.name+': '+err.message,'r');}
    };
    reader.readAsText(file);
  });
  input.value='';
}

function removeScenario(i){
  STATE.compareSlots.splice(i,1);
  STATE.scenarioA = STATE.compareSlots[0]?.data || null;
  STATE.scenarioB = STATE.compareSlots[1]?.data || null;
  renderCompareList();
}

function clearScenarios(){
  STATE.compareSlots=[]; STATE.scenarioA=null; STATE.scenarioB=null;
  renderCompareList();
  document.getElementById('compare-content').innerHTML=
    '<div style="text-align:center;color:var(--t3);font-size:9px;padding:30px">სცენარები წაიშალა.</div>';
}

function renderCompareList(){
  const list=document.getElementById('cmp-list');
  const cnt=document.getElementById('cmp-count');
  if(cnt) cnt.textContent = STATE.compareSlots.length+' loaded';
  const baseSel=document.getElementById('cmp-baseline');
  if(baseSel){
    if(STATE.compareBaseIndex >= STATE.compareSlots.length) STATE.compareBaseIndex = 0;
    baseSel.innerHTML = STATE.compareSlots.length
      ? STATE.compareSlots.map((s,i)=>`<option value="${i}">#${i+1} ${s.scenario}</option>`).join('')
      : '<option value="0">#1 baseline</option>';
    baseSel.value = String(STATE.compareBaseIndex||0);
  }
  if(!list) return;
  if(!STATE.compareSlots.length){ list.innerHTML=''; return; }
  list.innerHTML=STATE.compareSlots.map((s,i)=>`
    <div style="display:flex;gap:6px;align-items:center;font-size:8px;
         background:var(--bg2);padding:4px 6px;border-radius:4px">
      <span style="color:var(--teal);min-width:18px">#${i+1}</span>
      <span style="color:var(--t2);min-width:140px">${s.name}</span>
      <span style="color:var(--t3)">scenario=<b style="color:var(--t1)">${s.scenario}</b></span>
      <span style="color:var(--t3)">· ${s.horizon}h</span>
      <div style="flex:1"></div>
      <button class="btn btn-o btn-s" style="padding:1px 6px;font-size:7px"
              onclick="removeScenario(${i})">✕</button>
    </div>`).join('');
}

// Legacy hooks (a few places still call loadScenario('A'|'B')). Route to
// the new multi-slot store so nothing breaks.
function loadScenario(ab, input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const v=psValidateOutput(data);
      if(!v.ok) throw new Error(v.errors.slice(0,2).join('; '));
      const sid=(data.metadata&&data.metadata.scenario)||'?';
      const horizon=data.metadata?.horizon_hours||'?';
      const idx = ab==='A'?0:1;
      STATE.compareSlots[idx] = {name:f.name, scenario:sid, horizon:horizon, data:data};
      if(ab==='A') STATE.scenarioA=data; else STATE.scenarioB=data;
      renderCompareList();
      showBanner(`✅ Scenario ${ab} (${sid}) ჩაიტვ. — ${horizon}h`,'g');
    }catch(err){showBanner('❌ '+err.message,'r');}
    input.value='';
  };
  reader.readAsText(f);
}

function runComparison(){
  const slots = STATE.compareSlots;
  if(!slots.length){showBanner('⚠️ ჩატვირთე მინიმუმ ერთი სცენარი','o');return;}
  const kpis=[
    ['სულ ხარჯი $','total_cost_usd','$'],
    ['Avg λ $/MWh','avg_lambda_usd_mwh','$/MWh'],
    ['Peak MW','peak_load_mw','MW'],
    ['სულ ენ. MWh','total_energy_mwh','MWh'],
    ['Gas Mm³','total_gas_mm3','Mm³'],
    ['Unserved MWh','total_unserved_mwh','MWh'],
    ['Curtailed MWh','total_curtailed_mwh','MWh'],
  ];
  const selected = kpis.find(k=>k[1]===STATE.compareMetric) || kpis[0];
  const fmt=v=>(typeof v==='number')?(Math.abs(v)>=1e6?(v/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(1)+'k':v.toFixed(2)):(v??'—');
  const baseIndex=Math.min(Math.max(STATE.compareBaseIndex||0,0),slots.length-1);
  const hdrs = ['Metric', ...slots.map((s,i)=>`#${i+1} ${s.scenario}`)];
  if(slots.length>1) hdrs.push('Range', `Last Δ vs #${baseIndex+1}`);
  const rows = kpis.map(([lbl,k])=>{
    const vals = slots.map(s=>+(s.data.system_summary||{})[k]||0);
    const base = vals[baseIndex]||0;
    const min = Math.min(...vals), max = Math.max(...vals);
    const cells = [`<td>${lbl}</td>`, ...vals.map((v,i)=>{
      const d = i===baseIndex ? 0 : v-base;
      const cls = i===baseIndex ? '' : (d>0?'color:var(--red)':d<0?'color:var(--green)':'color:var(--t3)');
      const pct = (i!==baseIndex && base) ? ` <span style="color:var(--t3)">(${d>=0?'+':''}${(100*d/base).toFixed(1)}%)</span>` : '';
      return `<td class="mono" style="${cls}">${fmt(v)}${pct}</td>`;
    })];
    if(slots.length>1){
      const last = vals[vals.length-1];
      const d = last-base;
      const pct = base?100*d/base:0;
      cells.push(`<td class="mono">${fmt(max-min)}</td>`);
      cells.push(`<td class="mono" style="${d>0?'color:var(--red)':d<0?'color:var(--green)':'color:var(--t3)'}">${base?(pct>=0?'+':'')+pct.toFixed(1)+'%':'—'}</td>`);
    }
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
  const labels=slots.map((s,i)=>`#${i+1} ${s.scenario}`);
  const values=slots.map(s=>+(s.data.system_summary||{})[selected[1]]||0);
  STATE.lastCompareRows=labels.map((label,i)=>({scenario:label, metric:selected[1], value:values[i]}));
  renderCompareList();
  const content=document.getElementById('compare-content');
  content.innerHTML=`
    <div class="card" style="margin-bottom:6px">
      <div class="sh">KPI Matrix — ${slots.length} scenario${slots.length>1?'s':''}</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="chart-note">Percent deltas compare each scenario to the selected baseline. Red/green indicate numeric increase/decrease; business desirability depends on the metric.</div>
    </div>
    <div class="card">
      <div class="sh">📊 Selected metric — ${selected[0]}</div>
      <div id="c-compare-cost" style="height:280px"></div>
    </div>`;
  mkChart('c-compare-cost', {
    chart:{type:STATE.compareChartType||'bar',height:280,toolbar:{show:true},animations:{enabled:false},zoom:{enabled:true}},
    series:[{name:selected[0], data:values.map(v=>+v.toFixed(2))}],
    xaxis:{categories:labels,labels:{style:{fontSize:'8px'},rotate:-20}},
    yaxis:{labels:{formatter:v=>fmt(Number(v))},title:{text:selected[2]}},
    colors:['#3d8ef0'],
    plotOptions:{bar:{columnWidth:'55%',distributed:false}},
    dataLabels:{enabled:slots.length<=6,formatter:v=>fmt(Number(v)),style:{fontSize:'8px'}},
    legend:{show:false},
    tooltip:{y:{formatter:v=>fmt(Number(v))+' '+selected[2]}}
  });
}

const _charts={};
function mkChart(id, opts){
  const el=document.getElementById(id); if(!el) return;
  const theme=document.documentElement.getAttribute('data-theme')==='gse-light'?'light':'dark';
  const base={theme:{mode:theme},chart:{background:'transparent',fontFamily:'Noto Sans Georgian,sans-serif',
    foreColor:getCssVar('--t2'),toolbar:{show:false},zoom:{enabled:false}},
    grid:{borderColor:getCssVar('--grid-line')},
    tooltip:{theme,style:{fontSize:'9px'}},
    dataLabels:{enabled:false}};
  const merged=deepMerge(base,opts);
  if(_charts[id]){_charts[id].destroy();}
  _charts[id]=new ApexCharts(el,merged);
  _charts[id].render();
}

function getCssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

function deepMerge(a,b){
  const r=Object.assign({},a);
  for(const k in b){
    if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')
      r[k]=deepMerge(a[k],b[k]);
    else r[k]=b[k];
  }
  return r;
}

// INLINE ASSET VALIDATION (#17)  —  highlights cells as you type
// ══════════════════════════════════════════════════════════════════
// Quick field-level sanity checks on assets & horizon without waiting
// for the full validation run.  Red outline + inline hint near the
// offending field; reruns on every render/input.
function runInlineAssetChecks(){
  const notes=[];
  STATE.assets.forEach(a=>{
    if(a.type==='thermal'){
      if(+a.pmin >= +a.pmax) notes.push({id:a.id, msg:`${a.name}: pmin ≥ pmax`});
      if(+a.heat_rate<=0)    notes.push({id:a.id, msg:`${a.name}: heat_rate=0 (will default to vom)`});
      if(+a.min_up<1)        notes.push({id:a.id, msg:`${a.name}: min_up<1 (allowed but unusual)`});
    }
    if(a.type==='hydro_reg'){
      const h=a.hydro||{};
      if(+h.reservoir_init > +h.reservoir_max) notes.push({id:a.id, msg:`${a.name}: reservoir_init > reservoir_max`});
      if(+h.reservoir_init < +h.reservoir_min) notes.push({id:a.id, msg:`${a.name}: reservoir_init < reservoir_min`});
      if(+h.efficiency<=0)  notes.push({id:a.id, msg:`${a.name}: efficiency=0`});
    }
    if(a.type==='bess'){
      if(+a.soc_min >= +a.soc_max) notes.push({id:a.id, msg:`${a.name}: soc_min ≥ soc_max`});
      if(+a.eta_charge<=0 || +a.eta_discharge<=0)
        notes.push({id:a.id, msg:`${a.name}: efficiency ≤ 0`});
    }
  });
  const box=document.getElementById('asset-kpi');
  if(box && notes.length){
    const prior=box.innerHTML;
    box.innerHTML = prior + '<div style="margin-top:4px;color:var(--red);font-size:7.5px">'
      + notes.slice(0,3).map(n=>'⚠ '+n.msg).join('<br>')
      + (notes.length>3?`<br>… +${notes.length-3} more`:'') + '</div>';
  }
  return notes;
}
// Trigger on every asset-table render.
const _origRender = typeof renderAssetTable === 'function' ? renderAssetTable : null;
if(_origRender){
  renderAssetTable = function(){
    _origRender.apply(this, arguments);
    try{ runInlineAssetChecks(); }catch(e){}
  };
}

    list.innerHTML = '<div style="font-size:8px;color:var(--t3)">KPI template-ი არ არის</div>';
    return;
  }
  list.innerHTML = STATE.kpiTemplates.map((k,i)=>`
    <div style="display:flex;gap:4px;align-items:center;font-size:8px;
         background:var(--bg2);padding:3px 5px;border-radius:4px">
      <span style="color:var(--teal);min-width:100px"><b>${k.id}</b></span>
      <span style="color:var(--t2);min-width:180px">${k.label}</span>
      <code style="flex:1;color:var(--gold);font-size:7.5px">${k.formula}</code>
      <span style="color:var(--t3);min-width:40px;text-align:right">${k.unit||''}</span>
      <button class="btn btn-o btn-s" style="padding:1px 6px;font-size:7px"
              onclick="removeKpiTemplate(${i})">✕</button>
    </div>`).join('');
}

// ── KPI evaluator (mirror of solver/powersim_kpi.py) ─────────────────
function _kpiGetField(row, f){
  if(f==='hour_of_day') return (+row.hour_of_year || row.t || 0) % 24;
  if(f==='is_weekend')  return Math.floor((+row.hour_of_year || row.t || 0)/24)%7 >= 5;
  return row[f];
}
function _kpiParseFilter(s){
  s=s.trim();
  let m=s.match(/^(\w+)\s+between\s+([-\d.]+)\s+and\s+([-\d.]+)$/i);
  if(m){const[,f,lo,hi]=m; return r=>{const x=+_kpiGetField(r,f); return +lo<=x&&x<=+hi;};}
  m=s.match(/^(\w+)\s+in\s+\[([^\]]+)\]$/i);
  if(m){const f=m[1], items=m[2].split(',').map(x=>+x.trim());
        return r=>items.includes(+_kpiGetField(r,f));}
  m=s.match(/^(\w+)\s*(==|!=|<=|>=|<|>)\s*([-\d.]+)$/);
  if(m){const[,f,op,v]=m, num=+v;
    const ops={'==':(a,b)=>a==b,'!=':(a,b)=>a!=b,'<=':(a,b)=>a<=b,'>=':(a,b)=>a>=b,'<':(a,b)=>a<b,'>':(a,b)=>a>b};
    return r=>{const x=+_kpiGetField(r,f); return ops[op](x,num);};}
  throw new Error('bad filter: '+s);
}
function _kpiPercentile(vals,q){ if(!vals.length) return 0;
  const s=[...vals].sort((a,b)=>a-b); return s[Math.max(0,Math.min(s.length-1, Math.round(q*(s.length-1))))]; }

function evaluateKpiTemplate(formula, results){
  const m = (formula||'').trim().match(/^(\w+)\s*\(([\s\S]*)\)\s*$/);
  if(!m) throw new Error('unrecognised formula');
  const fn = m[1].toLowerCase(); const args = m[2].trim();
  const hs = results.hourly_system||[];
  const bu = results.by_unit_summary||{};
  if(fn==='ratio'){
    const [ns,ds] = args.split('/');
    const num=hs.reduce((s,r)=>s+(+_kpiGetField(r,ns.trim())||0),0);
    const den=hs.reduce((s,r)=>s+(+_kpiGetField(r,ds.trim())||0),0);
    return den?num/den:0;
  }
  if(fn==='hours_where'){ const p=_kpiParseFilter(args); return hs.filter(p).length; }
  if(fn==='by_unit_sum'){ const [f,aid]=args.split(',').map(x=>x.trim()); return +(bu[aid]||{})[f]||0; }
  let vals;
  if(args.includes('|')){
    const [f,filt]=args.split('|').map(x=>x.trim());
    const p=_kpiParseFilter(filt); vals=hs.filter(p).map(r=>+_kpiGetField(r,f)||0);
  } else { vals=hs.map(r=>+_kpiGetField(r,args)||0); }
  if(fn==='sum')   return vals.reduce((a,b)=>a+b,0);
  if(fn==='avg'||fn==='mean') return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  if(fn==='min')   return vals.length?Math.min(...vals):0;
  if(fn==='max')   return vals.length?Math.max(...vals):0;
  if(fn==='count') return vals.length;
  if(fn==='p10')   return _kpiPercentile(vals,0.10);
  if(fn==='p50')   return _kpiPercentile(vals,0.50);
  if(fn==='p90')   return _kpiPercentile(vals,0.90);
  throw new Error('unknown function: '+fn);
}

function evaluateKpiTemplatesOnResults(){
  if(!STATE.results){ showBanner('⚠ Results ჯერ არ ჩაიტვ.','o'); return; }
  if(!STATE.kpiTemplates.length){ showBanner('⚠ KPI template არ არის — loadDefaults','o'); return; }
  const box = document.getElementById('kpi-templates-eval');
  const rows = STATE.kpiTemplates.map(k=>{
    try{
      const v = evaluateKpiTemplate(k.formula, STATE.results);
      return `<div>✓ <b>${k.id}</b> (${k.label}) = <span style="color:var(--teal)">${(+v).toFixed(3)}</span> ${k.unit||''}</div>`;
    }catch(e){
      return `<div style="color:var(--red)">✗ ${k.id}: ${e.message}</div>`;
    }
  });
  box.innerHTML = rows.join('');
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
function init(){
  initLanguage();
  // Auto-seed the GSE 2026-2030 P50 demand snapshot into STATE.demandScenarios
  // and set 2030 as the active demand so the solver picks it up without any
  // click. If STATE.profiles.demand is already set (import / hand-loaded),
  // leave it — the seed only fills empty slots.
  try{
    if(typeof _ensureDemandStateInit === 'function'){
      _ensureDemandStateInit();
      if(!STATE.profiles['demand'] || !STATE.profiles['demand'].length){
        if(STATE.activeDemandKey && STATE.demandScenarios[STATE.activeDemandKey]){
          STATE.profiles['demand'] = STATE.demandScenarios[STATE.activeDemandKey].slice();
        }
      }
    }
  }catch(_){}
  renderWorkflowSteps();
  updateDashKpis();
  updateHorizonPreview();
  // Monthly gas grid
  const grid=document.getElementById('gas-monthly-grid');
  if(grid&&!grid.children.length){
    const defaults={jan:110,feb:100,mar:95,apr:85,may:75,jun:70,
                    jul:70,aug:75,sep:80,oct:90,nov:100,dec:110};
    grid.innerHTML=MONTHS.map((m,i)=>`
      <div style="display:flex;align-items:center;gap:4px">
        <label style="font-size:8px;color:var(--t3);width:30px">${MONTH_LABELS[i]}</label>
        <input type="number" value="${defaults[m]}" step="1" min="0"
               style="width:70px;font-size:8px"
               oninput="STATE.gasConfig.monthly['${m}']=+this.value">
      </div>`).join('');
    Object.assign(STATE.gasConfig.monthly,defaults);
  }
  applyTranslations();
}
init();
</script>
<script>(function(){
  'use strict';
  const STORAGE_URL = 'powersim_ai_backend_url';
  const STORAGE_SESSION = 'powersim_ai_session_id';
  const DEFAULT_URL = 'http://localhost:8000';
  const MAX_JSON_CHARS = 18000;
  const state = {sessionId:null, backendUrl:DEFAULT_URL, online:false, busy:false};
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function ensureFab(){
    if(document.getElementById('ai-fab')) return document.getElementById('ai-fab');
    const b=document.createElement('button');
    b.id='ai-fab'; b.className='ai-fab'; b.type='button';
    b.title='PowerSim AI Assistant'; b.innerHTML='<span>🤖</span><span>AI</span>';
    b.addEventListener('click', ()=>toggle());
    document.body.appendChild(b);
    return b;
  }
  function init(){
    state.sessionId = getSessionId();
    state.backendUrl = localStorage.getItem(STORAGE_URL) || DEFAULT_URL;
    if($('ai-backend-url')) $('ai-backend-url').value = state.backendUrl;
    ensureFab();
    addSystem('AI backend is not connected.\n\nStart backend:\nuvicorn backend.powersim_ai_server:app --reload --port 8000\n\nSet API key on backend:\nexport OPENAI_API_KEY=...\n\nNo API key is stored in browser.');
    health();
    setInterval(health, 30000);
    $('ai-chat-input')?.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey || e.metaKey)){ send(); } });
  }
  function getSessionId(){
    let sid = localStorage.getItem(STORAGE_SESSION);
    if(!sid){ sid = 'ps-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10); localStorage.setItem(STORAGE_SESSION,sid); }
    return sid;
  }
  function toggle(force){ const d=$('powersim-ai-chat'); if(d) d.classList.toggle('open', typeof force==='boolean'?force:!d.classList.contains('open')); }
  function saveBackendUrl(){ state.backendUrl = ($('ai-backend-url')?.value || DEFAULT_URL).replace(/\/$/,''); localStorage.setItem(STORAGE_URL,state.backendUrl); health(); }
  function setStatus(ok, text){ const el=$('ai-backend-status'); state.online=!!ok; if(el){ el.textContent=text || (ok?'online':'offline'); el.className='ai-status '+(ok?'ok':'bad'); } }
  function showError(msg){ const e=$('ai-error-panel'); if(!e) return; e.style.display=msg?'block':'none'; e.innerHTML=esc(msg); }
  async function api(path, payload){
    const res = await fetch(state.backendUrl + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload||{})});
    if(!res.ok) throw new Error(path+' failed: HTTP '+res.status);
    return res.json();
  }
  async function health(){
    saveUrlFromInputOnly();
    try{ const r = await fetch(state.backendUrl + '/api/ai/health', {cache:'no-store'}); setStatus(r.ok, r.ok?'online':'offline'); }
    catch(_e){ setStatus(false,'offline'); }
  }
  function saveUrlFromInputOnly(){ const v=$('ai-backend-url')?.value; if(v) state.backendUrl=v.replace(/\/$/,''); }
  function addMsg(role, text){ const box=$('ai-chat-messages'); if(!box) return; const div=document.createElement('div'); div.className='ai-msg '+role; div.innerHTML=esc(text); box.appendChild(div); box.scrollTop=box.scrollHeight; }
  function addSystem(text){ addMsg('system', text); }
  function currentLanguage(){ return $('ai-language')?.value || 'auto'; }
  function compact(obj){
    if(!obj) return null;
    const s = JSON.stringify(obj);
    if(s.length <= MAX_JSON_CHARS) return obj;
    return {truncated:true, original_chars:s.length, summary:sliceSummary(obj)};
  }
  function sliceSummary(obj){
    return {metadata:obj.metadata||null, system_summary:obj.system_summary||null, diagnostics:obj.diagnostics||null,
      hourly_system_sample:Array.isArray(obj.hourly_system)?obj.hourly_system.slice(0,24):undefined,
      assets:Array.isArray(obj.assets)?obj.assets.slice(0,50):undefined};
  }
  function buildAiContextSummary(){
    let input = null;
    try { if(typeof window.buildInputPayload === 'function') input = compact(window.buildInputPayload()); } catch(e){ input = {error:'input summary unavailable: '+e.message}; }
    const results = compact(window.STATE?.results || null);
    const compareSlots = (window.STATE?.compareSlots || []).map((s,i)=>({index:i, name:s.name, scenario:s.scenario, horizon:s.horizon, summary:sliceSummary(s.data||{})}));
    return {session_id:state.sessionId, language:currentLanguage(), current_input:input, current_results:results,
      ui_state:{active_tab:document.querySelector('.tab.on')?.dataset?.tab || null, compare_scenarios:compareSlots, assets_count:window.STATE?.assets?.length || 0}};
  }
  async function send(){
    const inp=$('ai-chat-input'); const message=(inp?.value||'').trim(); if(!message) return;
    showError(''); addMsg('user', message); inp.value=''; renderProgress('Thinking…');
    try{
      const context=buildAiContextSummary();
      const reply=await api('/api/ai/chat', {...context, message});
      renderProgress(''); addMsg('assistant', reply.reply || reply.message || reply.answer || 'No text reply returned.');
      renderActions(reply.proposed_actions || []);
      renderBackendResult(reply);
    }catch(e){ renderProgress(''); showError('AI backend is not connected. Start the backend server to use chat. '+e.message); }
  }
  function renderProgress(text){ let el=$('ai-progress'); const list=$('ai-action-list'); if(!el && list){ el=document.createElement('div'); el.id='ai-progress'; el.className='ai-progress'; list.prepend(el); } if(el) el.textContent=text||''; }
  function renderActions(actions){
    const list=$('ai-action-list'); if(!list) return; list.querySelectorAll('.ai-action').forEach(n=>n.remove());
    actions.forEach(a=>{ const card=document.createElement('div'); card.className='ai-action';
      const changes=Array.isArray(a.changes)?a.changes:Object.entries(a.changes||{}).map(([k,v])=>k+': '+JSON.stringify(v));
      card.innerHTML=`<h4>${esc(a.title||a.action_id||'Proposed action')}</h4><p>${esc(a.description||'')}</p><span class="ai-risk">${esc(a.risk_level||'review')}</span><ul class="ai-change-list">${changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="ai-result-actions"><button class="btn btn-p btn-s">Confirm</button><button class="btn btn-o btn-s">Cancel</button></div>`;
      card.querySelector('.btn-p').onclick=()=>confirmAction(a, card); card.querySelector('.btn-o').onclick=()=>card.remove(); list.appendChild(card); });
  }
  async function confirmAction(action, card){
    renderProgress('Running confirmed action…');
    try{ const res=await api('/api/ai/confirm', {session_id:state.sessionId, action_id:action.action_id, action, context:buildAiContextSummary()}); renderProgress(''); addMsg('assistant', res.reply || res.message || 'Confirmed action completed.'); renderBackendResult(res, card); }
    catch(e){ renderProgress(''); showError('Confirmed action failed: '+e.message); }
  }
  function renderBackendResult(res, card){
    if(!res) return; const host=card || $('ai-action-list'); if(!host) return; const wrap=document.createElement('div'); wrap.className='ai-result-actions';
    if(res.patched_input){ const b=button('Apply to current scenario',()=>applyPatchedInput(res.patched_input)); wrap.appendChild(b); }
    if(res.results_json || res.results){ const b=button('Import results',()=>importResultsObject(res.results_json || res.results)); wrap.appendChild(b); }
    if(res.comparison){ addMsg('assistant', 'Comparison summary:\n'+JSON.stringify(res.comparison,null,2)); }
    if(wrap.children.length) host.appendChild(wrap);
  }
  function button(text, fn){ const b=document.createElement('button'); b.className='btn btn-g btn-s'; b.type='button'; b.textContent=text; b.onclick=fn; return b; }
  function applyPatchedInput(input){ addMsg('system','Patched input received. Stage 1 does not overwrite all editor fields automatically; export/apply workflow hook is ready.'); window.PowerSimAIPatchedInput=input; }
  function importResultsObject(data){ if(!data) return; window.STATE.results=data; if(typeof window.renderWorkflowSteps==='function') window.renderWorkflowSteps(); if(typeof window.goTab==='function') window.goTab('results'); if(typeof window.renderResults==='function') window.renderResults(); if(typeof window.renderReports==='function') try{window.renderReports();}catch(e){} addMsg('system','Results imported into the Results tab.'); }
  function selfCheck(){
    return {
      hasDrawer:!!$('powersim-ai-chat'),
      hasToolbarButton:!!document.querySelector('.ai-toggle'),
      hasFloatingButton:!!$('ai-fab'),
      hasBackendUrl:!!$('ai-backend-url'),
      noHardcodedSecret:!document.documentElement.innerHTML.match(new RegExp('s'+'k-[A-Za-z0-9_-]{20,}')),
      canBuildContext:!!buildAiContextSummary().session_id,
      backendOnline:!!state.online,
    };
  }
  window.PowerSimAIChat = {init,toggle,send,saveBackendUrl,health,buildAiContextSummary,renderActions,importResultsObject,selfCheck};
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
