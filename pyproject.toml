[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powersim"
dynamic = ["version"]
description = "PowerSim power-system planning contracts and tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110", "uvicorn>=0.27", "pyomo>=6.7", "highspy>=1.7", "numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "xlsxwriter>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.48", "build>=1", "httpx>=0.27"]

[project.scripts]
powersim = "powersim.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "powersim.version.__version__"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["powersim*", "solver*"]

[tool.setuptools.package-data]
powersim = ["ui/static/*"]

# Reference catalogue and sample projects, located at runtime by
# powersim.resources.resource_path (<prefix>/powersim/<relative path>).
[tool.setuptools.data-files]
"powersim/data/reference/plant_parameters" = [
  "data/reference/plant_parameters/manifest.json",
  "data/reference/plant_parameters/stations_by_location.json",
  "data/reference/plant_parameters/reservoirs.json",
  "data/reference/plant_parameters/hydropower_assets.json",
  "data/reference/plant_parameters/hpp_summary.json",
  "data/reference/plant_parameters/plant_detail_sheets.json",
]
"powersim/samples/projects" = ["samples/projects/georgia_2026_baseline.json"]
"powersim/samples" = ["samples/application_compact_demo.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
