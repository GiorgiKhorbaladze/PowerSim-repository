[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powersim"
dynamic = ["version"]
description = "PowerSim power-system planning contracts and tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110", "uvicorn>=0.27", "pyomo>=6.7", "highspy>=1.7", "numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "xlsxwriter>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.48"]

[project.scripts]
powersim = "powersim.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "powersim.version.__version__"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["powersim*", "solver*"]

[tool.setuptools.data-files]
"powersim/ui" = [
  "html/PowerSim_v4.html",
  "html/gse_load_2026_2030.js",
  "html/powersim_ai_chat.css",
  "html/powersim_ai_chat.js",
  "html/powersim_ror_autobind_2026.js",
  "html/powersim_ror_profiles_2026.js",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
